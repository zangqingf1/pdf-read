version: '3.8'

services:
  # ========== Frontend ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    # 端口不对外暴露，仅通过 nginx 反向代理访问

  # ========== Backend API ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:${DB_PASSWORD:-pdfreader_pass}@db:5432/pdfreader
      - DATABASE_URL_SYNC=postgresql://user:${DB_PASSWORD:-pdfreader_pass}@db:5432/pdfreader
      - REDIS_URL=redis://redis:6379/0
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - MINERU_API_TOKEN=${MINERU_API_TOKEN}
      - MINERU_API_BASE=${MINERU_API_BASE:-https://mineru.net}
      - PADDLEOCR_MODEL_PATH=/models/paddleocr
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - uploads_data:/app/uploads
      - paddleocr_models:/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ========== Celery Worker ==========
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker -l info -c 2
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:${DB_PASSWORD:-pdfreader_pass}@db:5432/pdfreader
      - REDIS_URL=redis://redis:6379/0
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - MINERU_API_TOKEN=${MINERU_API_TOKEN}
      - MINERU_API_BASE=${MINERU_API_BASE:-https://mineru.net}
      - PADDLEOCR_MODEL_PATH=/models/paddleocr
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - uploads_data:/app/uploads
      - paddleocr_models:/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ========== PostgreSQL ==========
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdfreader
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pdfreader_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pdfreader"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ========== Nginx (Reverse Proxy) ==========
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads_data:
  paddleocr_models:
